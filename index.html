<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabriel Marcel — Open Multilingual Digital Corpus</title>
  
  <meta name="theme-color" content="#8b2500">
  <link rel="manifest" href="manifest.json">
  
  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="header-inner">
      <div class="site-brand">
        <span class="brand-title">Gabriel Marcel</span>
        <select id="work-select" class="work-select" onchange="switchWork(this.value)"></select>
      </div>

      <div class="top-actions">
        <button class="btn" onclick="openSearchModal()" title="Search Entire Corpus (Ctrl+K)" aria-label="Search Entire Corpus">
          🔍 Search
        </button>

        <div class="btn-group mode-toggle-group" role="group" aria-label="Reading Mode">
          <button class="btn active" id="btn-mode-split" onclick="setMode('split')">Split</button>
          <button class="btn" id="btn-mode-en" onclick="setMode('en')">English</button>
          <button class="btn" id="btn-mode-fr" onclick="setMode('fr')">Français</button>
        </div>

        <div class="btn-group reader-prefs-group" role="group" aria-label="Reading Preferences">
          <button class="btn btn-icon" onclick="adjustFontSize(-1)" title="Decrease font size" aria-label="Decrease font size">A−</button>
          <button class="btn btn-icon" onclick="adjustFontSize(1)" title="Increase font size" aria-label="Increase font size">A+</button>
          <select id="theme-select" class="theme-select" onchange="setTheme(this.value)" title="Reading Theme" aria-label="Reading Theme">
            <option value="light">📜 Paper</option>
            <option value="sepia">🕯️ Sepia</option>
            <option value="dark">🌙 Dark</option>
          </select>
        </div>

        <button class="btn" onclick="toggleNotebook()" title="Personal Notebook" aria-label="Personal Notebook">
          📝 Notes <span id="notes-badge" class="btn-badge">0</span>
        </button>

        <button class="btn" onclick="toggleGlossary()" title="Marcelian Philosophical Glossary" aria-label="Philosophical Glossary">
          📖 Glossary
        </button>
      </div>
    </div>
  </header>

  <!-- Work Context & Companion Metadata -->
  <div class="meta-bar">
    <div class="meta-inner">
      <div id="companion-indicator"></div>
      <div id="work-details" class="text-muted"></div>
    </div>
  </div>

  <!-- Reader Body -->
  <main class="reader-container">
    <div class="work-header">
      <h2 id="work-title-fr"></h2>
      <h3 id="work-title-en"></h3>
    </div>

    <!-- Chapter / Section / Act Sub-Navigation -->
    <nav id="section-nav" class="section-nav" aria-label="Work Sections and Chapters" style="display:none;">
      <div class="section-nav-inner">
        <div class="section-pills-label">Sections / Acts:</div>
        <div id="section-pills" class="section-pills"></div>
      </div>
      <div id="section-progress" class="section-progress"></div>
    </nav>

    <div id="reader-grid" class="reader-grid mode-split">
      <div class="reader-columns-header" id="reader-columns-header">
        <div class="column-header col-header-fr">
          <span>Texte Français (Domaine Public)</span>
          <span class="lang-pill">FR</span>
        </div>
        <div class="column-header col-header-en">
          <span>Marcelian Translation Edition</span>
          <span class="lang-pill">EN</span>
        </div>
      </div>

      <div id="reader-blocks" class="reader-blocks"></div>
    </div>
  </main>

  <!-- Instapaper-style Floating Selection Toolbar -->
  <div id="selection-toolbar">
    <button onclick="applyHighlightFromSelection(false)">🖊️ Highlight</button>
    <button onclick="applyHighlightFromSelection(true)">💬 Add Note</button>
  </div>

  <!-- Note Editor Modal -->
  <div id="note-modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
    <div class="note-modal">
      <div class="note-modal-header">
        <h3 id="note-modal-title">Highlight & Note</h3>
        <button class="btn" onclick="closeNoteModal()" style="border:none;" aria-label="Close Note Modal">✕</button>
      </div>
      <div class="note-modal-body">
        <div id="modal-quote" class="highlight-quote"></div>
        <textarea id="modal-note-text" class="note-textarea" placeholder="Add an analytical observation, cross-reference, or reflection..."></textarea>
        <div class="tags-section">
          <div class="tags-label">Tags</div>
          <div id="modal-tag-chips" class="tag-chips"></div>
          <input type="text" id="modal-tag-input" class="tag-input" placeholder="Add tag and press Enter (e.g. #mystery, #disponibilite)..." onkeydown="handleTagInput(event)">
        </div>
      </div>
      <div class="note-modal-footer">
        <button class="btn" style="color:#dc2626; border-color:#fca5a5;" onclick="deleteCurrentHighlight()">Delete</button>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn" onclick="closeNoteModal()">Cancel</button>
          <button class="btn active" onclick="saveCurrentNote()">Save Note</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Personal Notebook Drawer -->
  <aside id="notebook-drawer" class="drawer" role="region" aria-label="Personal Notebook">
    <div class="drawer-header">
      <div class="drawer-title">Personal Notebook</div>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <button class="btn" style="font-size:0.75rem;" onclick="exportNotesMarkdown()">Export .md</button>
        <button class="btn" onclick="toggleNotebook()" style="border:none;" aria-label="Close Notebook">✕</button>
      </div>
    </div>
    <div class="drawer-body">
      <input type="text" id="notebook-search-input" class="notebook-search" placeholder="Search highlights, notes, tags..." oninput="renderNotebook()">
      <div class="tags-label">Filter by Tag:</div>
      <div id="notebook-tags-filter" class="tag-filter-list"></div>
      <div id="notebook-cards-container"></div>
    </div>
  </aside>

  <!-- Philosophical Glossary Drawer -->
  <aside id="glossary-drawer" class="drawer" role="region" aria-label="Philosophical Glossary">
    <div class="drawer-header">
      <div class="drawer-title">Marcelian Philosophical Glossary</div>
      <button class="btn" onclick="toggleGlossary()" style="border:none;" aria-label="Close Glossary">✕</button>
    </div>
    <div class="drawer-body" id="glossary-cards-container"></div>
  </aside>

  <!-- Global Bilingual Search Modal -->
  <div id="search-modal-backdrop" class="search-modal-backdrop" onclick="handleSearchBackdropClick(event)" role="dialog" aria-modal="true" aria-label="Global Bilingual Search">
    <div class="search-dialog" onclick="event.stopPropagation()">
      <div class="search-input-box">
        <span style="margin-right:0.75rem;">🔍</span>
        <input type="text" id="global-search-input" placeholder="Search entire Marcel corpus (works, glossary, passages)..." oninput="handleSearchInput()">
        <button class="btn" onclick="closeSearchModal()" style="border:none;">Esc</button>
      </div>
      <div class="search-filters">
        <span style="color:var(--text-muted); align-self:center;">Scope:</span>
        <button class="btn active" id="search-filter-all" onclick="setSearchFilter('all')">All</button>
        <button class="btn" id="search-filter-en" onclick="setSearchFilter('en')">English</button>
        <button class="btn" id="search-filter-fr" onclick="setSearchFilter('fr')">Français</button>
      </div>
      <div id="search-results-list" class="search-results"></div>
    </div>
  </div>

  <!-- Inline Philosophical Glossary Popover -->
  <div id="glossary-popover" class="glossary-popover" role="tooltip" aria-hidden="true"></div>

  <div id="toast"></div>

  <!-- Data Layer -->
  <script src="data/glossary.js"></script>
  <script src="data/corpus.js"></script>
  <script src="data/works/positions-mystere-ontologique.js"></script>

  <!-- Application Logic Modules -->
  <script src="js/reader.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
